[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-dialog-cli"
dynamic = ["version"]
description = "伴界 BanVerse：支持多平台文本、图片与语音的角色聊天应用"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
desktop = [
    "PySide6>=6.7",
    "keyring>=25.0",
    "edge-tts>=7,<8",
    "websocket-client>=1.8,<2",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.0",
    "ruff>=0.6",
]

[project.scripts]
deepseek-cli = "deepseek_cli.cli:main"
deepseek-app = "deepseek_cli.desktop.main:main"
banverse = "deepseek_cli.desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "deepseek_cli._version.__version__"}

[tool.setuptools.package-data]
"deepseek_cli.desktop" = [
    "resources/*.png",
    "resources/*.wav",
    "resources/builtin_characters/*.json",
    "resources/builtin_avatars/*.png",
]

[tool.pytest.ini_options]
addopts = "-q --cov=deepseek_cli --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["deepseek_cli"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]
