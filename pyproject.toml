[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-dialog-cli"
version = "0.1.12"
description = "伴界 BanVerse：支持多平台文本、图片与语音的角色聊天应用"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
desktop = [
    "PySide6>=6.7",
    "keyring>=25.0",
    "edge-tts>=7,<8",
    "websocket-client>=1.8,<2",
]
test = [
    "pytest>=7.0",
]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.0",
]

[project.scripts]
deepseek-cli = "deepseek_cli.cli:main"
deepseek-app = "deepseek_cli.desktop.main:main"
banverse = "deepseek_cli.desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deepseek_cli.desktop" = [
    "resources/*.png",
    "resources/*.wav",
    "resources/builtin_characters/*.json",
    "resources/builtin_avatars/*.png",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
